[package]
name = "lnc-styles-gallery"
version = "1.0.0"
edition = "2021"
description = "LNC Style Library — Rust single-binary backend, MCP server & SPA host"
license = "UNLICENSED"
publish = false

[lib]
name = "lnc_styles_gallery"
path = "src/lib.rs"

[[bin]]
name = "lnc-styles-gallery"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
